name: Release

# A ogni push su main compila l'app e pubblica la Release "v<versione>"
# (versione = CFBundleShortVersionString in Info.plist). Per una nuova release
# basta alzare la versione in Info.plist.
on:
  push:
    branches: [main]
    paths: ["UpdateBar.swift", "Info.plist", "AppIcon.icns", "build.sh", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versione
        id: version
        run: echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./build.sh --ci

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UpdateBar
          path: dist/UpdateBar.zip

      - name: Pubblica Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: UpdateBar ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/UpdateBar.zip
          make_latest: true
          generate_release_notes: true
